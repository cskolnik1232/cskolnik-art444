<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="author" content="Art 444 Student Practice">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Hello World!</title>
  <style> 
   
.title {
  display: none;
}




@keyframes move {
  0% {background-color: blueviolet; top: 10px; left: 10px;}
  50% {background-color: cadetblue; top: 100px; left: 100px;}
  100% {background-color: palevioletred; top: 500px; left:500px;}
}



.block {
  width: 100px;
  height: 100px;
  background-color: blueviolet;
  position: relative;
  animation-name: move;
  animation-duration: 5s;
}


.trans {
  width: 100px;
  height: 100px;
  background-color:aquamarine;
  transition: width 3s;

}

.trans:hover {
  width: 500px;
}










</style>
</head>
<body>


<p class="title">Hello World!</p>

<button class="button"> click here </button>





<div class="block"> </div>


<div class="trans"> </div>




<script>

const mainTitle = document.querySelector('.title').classList;

const button = document.querySelector('.button');





function reveal() {
  mainTitle.toggle('title');
}

button.addEventListener('click', reveal);



document.querySelector('.button').addEventListener('click', reveal);








</script>


</body>
